<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>jk-admin · 计科创新中心</title>
<style>
:root{
  --bg:#f2f1ee; --surface:#fdfcfa; --tone:#eae9e6; --tone-2:#e0dfdc;
  --ink:#4a4640; --ink-2:#6d675e;
  --primary:#6b8ca3; --primary-d:#55748a;
  --ok:#7f9a75; --warn:#c08a55; --danger:#b9807f; --info:#8d84ab;
  --r:16px; --ease:cubic-bezier(.2,.8,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.6 "PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

/* ---------- 骨架 ---------- */
.app{display:grid;grid-template-columns:224px 1fr;min-height:100dvh}
.app[hidden]{display:none}

.rail{padding:26px 16px;background:var(--surface);display:flex;flex-direction:column;gap:26px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;cursor:pointer}
.brand i{width:26px;height:26px;border-radius:9px;background:var(--primary);display:block}
.brand b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.brand span{display:block;font-size:13px;color:var(--ink-2);font-weight:400;margin-top:1px}

.nav{display:flex;flex-direction:column;gap:2px}
.nav a{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 12px;border-radius:11px;font-size:14.5px;color:var(--ink-2);
  text-decoration:none;transition:background .16s var(--ease),color .16s var(--ease);
}
.nav a:hover{background:var(--tone);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--tone);color:var(--ink);font-weight:600}
.nav em{font-style:normal;font-size:13px;background:var(--danger);color:#fff;border-radius:8px;padding:1px 7px}
.me{margin-top:auto;padding:0 8px;display:flex;align-items:center;gap:10px}
.me i{width:30px;height:30px;border-radius:50%;background:var(--tone-2);display:grid;place-items:center;font-size:13px;font-style:normal;color:var(--ink-2)}
.me b{font-size:13.5px;font-weight:600}.me span{font-size:13px;color:var(--ink-2)}

.main{padding:32px 44px 72px;max-width:1180px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}
.bar h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.bar p{font-size:13px;color:var(--ink-2);margin-top:3px}

/* ---------- 焦点块：唯一的"今天" ---------- */
.focus{
  background:var(--surface);border-radius:22px;padding:40px 44px;
  display:flex;align-items:center;gap:34px;margin-bottom:16px;min-height:230px;
}
.focus__n{font-size:108px;font-weight:600;line-height:.9;letter-spacing:-.05em;color:var(--primary-d)}
.focus__t{flex:1}
.focus__t b{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.focus__t span{font-size:14px;color:var(--ink-2)}
.btn{
  background:var(--primary-d);color:#fff;border-radius:11px;padding:10px 18px;
  font-size:13.5px;font-weight:500;transition:transform .16s var(--ease),background .16s var(--ease);
}
.btn:hover{background:var(--primary)}
.btn:active{transform:scale(.97)}
.btn--ghost{background:var(--tone);color:var(--ink)}
.btn--ghost:hover{background:var(--tone-2)}

/* ---------- 卡片与栅格 ---------- */
.grid{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:1.4fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.card{background:var(--surface);border-radius:var(--r);padding:22px 24px;min-width:0}
.card h2{font-size:13.5px;font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between;align-items:baseline}
.card h2 span{font-size:13px;color:var(--ink-2);font-weight:400}

/* 图表 */
.chart{width:100%;height:172px;display:block;overflow:visible}
.chart path.line{fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) .12s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart path.area{fill:var(--primary);opacity:.09;animation:fadein .6s ease .5s both}
@keyframes fadein{from{opacity:0}to{opacity:.09}}
.axis{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-top:6px}

.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:76px 1fr 30px;align-items:center;gap:12px;font-size:13px}
.bar-row .track{height:8px;background:var(--tone);border-radius:6px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--primary);border-radius:6px;width:0;transition:width .9s var(--ease)}
.bar-row var{font-style:normal;font-size:13px;color:var(--ink-2);text-align:right}

.donut{display:flex;align-items:center;gap:22px}
.donut svg{flex:none}
.donut circle[data-arc]{animation:arc .9s var(--ease) both}
@keyframes arc{from{stroke-dasharray:0 999}}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:8px}
.legend b{font-weight:400;color:var(--ink-2);margin-left:6px}

.ai{background:var(--tone);border-radius:var(--r);padding:18px 22px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-2)}
.ai i{width:8px;height:8px;border-radius:50%;background:var(--primary);animation:breathe 2.6s var(--ease) infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------- 视图切换动画 ---------- */
.view{animation:viewin .34s var(--ease) both}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 65ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- 分段控件 ---------- */
.seg{display:inline-flex;background:var(--tone);border-radius:11px;padding:3px;gap:2px;margin-bottom:16px}
.seg button{padding:7px 15px;border-radius:9px;font-size:13.5px;color:var(--ink-2);transition:background .18s var(--ease),color .18s var(--ease)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:13px;color:var(--ink-2);padding:0 14px 10px;white-space:nowrap}
td{padding:13px 14px;vertical-align:middle}
tbody tr{border-radius:10px;transition:background .15s var(--ease)}
tbody tr:hover{background:var(--tone)}
td b{font-weight:600}
.muted{color:var(--ink-2)}
.tag{display:inline-block;font-size:13px;padding:2px 9px;border-radius:7px;white-space:nowrap}
.t-ok{background:rgba(127,154,117,.16);color:#5a7350}
.t-warn{background:rgba(192,138,85,.16);color:#96682f}
.t-danger{background:rgba(185,128,127,.17);color:#8f5b5a}
.t-info{background:rgba(141,132,171,.16);color:#6a618a}
.t-mute{background:var(--tone-2);color:var(--ink-2)}
.act{font-size:13px;color:var(--primary-d);padding:2px 0;margin-right:12px;transition:color .15s}
.act:hover{color:var(--primary);text-decoration:underline}
.act--danger{color:#8f5b5a}

/* ---------- 行内展开（替代弹窗） ---------- */
.xp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s var(--ease)}
.xp>div{overflow:hidden}
tr.open .xp{grid-template-rows:1fr}
.xp-body{background:var(--tone);border-radius:12px;padding:16px 18px;margin:2px 0 12px}
.xp-body p{font-size:13.5px;line-height:1.7;margin-bottom:12px}
.xp-form{display:flex;gap:10px;align-items:flex-start}
.xp-form textarea{
  flex:1;background:var(--surface);border:0;border-radius:10px;padding:11px 13px;
  font:inherit;font-size:13.5px;color:var(--ink);resize:vertical;min-height:64px;
}
.xp-form textarea::placeholder{color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-bottom:12px}
.kv dt{color:var(--ink-2)}.kv dd{margin:0}

/* ---------- 抽屉 ---------- */
.scrim{position:fixed;inset:0;background:rgba(74,70,64,.24);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .28s var(--ease),visibility .28s;z-index:40}
.scrim.on{opacity:1;visibility:visible;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(520px,92vw);background:var(--bg);
  z-index:41;transform:translateX(100%);transition:transform .36s var(--ease);
  box-shadow:-24px 0 60px rgba(74,70,64,.14);padding:26px 30px;overflow:auto; /* taste-skill-ignore: 真实抽屉浮层 */
}
.drawer.on{transform:none}
.drawer h2{font-size:20px;font-weight:600;margin-bottom:4px}
.drawer .sub{font-size:13px;color:var(--ink-2);margin-bottom:22px}
.drawer .close{position:absolute;top:22px;right:24px;font-size:20px;color:var(--ink-2);line-height:1}
.tl{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.tl li{list-style:none;display:grid;grid-template-columns:64px 1fr;gap:12px;font-size:13.5px}
.tl time{color:var(--ink-2);font-size:13px}

/* ---------- 登录 ---------- */
.login{min-height:100dvh;display:grid;place-items:center;background:var(--bg)}
.login[hidden]{display:none}
.login__box{width:340px;animation:viewin .5s var(--ease) both}
.login__box>*{animation:rise .55s var(--ease) both}
.login__box>*:nth-child(1){--i:0}.login__box>*:nth-child(2){--i:1}
.login__box>*:nth-child(3){--i:2}.login__box>*:nth-child(4){--i:2}
.login__box>*:nth-child(5){--i:3}.login__box>*:nth-child(6){--i:4}.login__box>*:nth-child(7){--i:4}.login__box>*:nth-child(8){--i:5}
.login__box h1{font-size:34px;font-weight:600;letter-spacing:-.03em;margin-bottom:6px}
.login__box p{font-size:13.5px;color:var(--ink-2);margin-bottom:26px}
.login__box label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.login__box input{
  width:100%;background:var(--surface);border:0;border-radius:11px;padding:12px 14px;
  font:inherit;font-size:14px;color:var(--ink);margin-bottom:14px;
}
.login__box .btn{width:100%;margin-top:8px}
.err{font-size:13px;color:#8f5b5a;margin-top:12px;opacity:0;transition:opacity .2s}
.err.on{opacity:1}

/* ---------- 空状态 / 表单 ---------- */
.empty{padding:40px 0;text-align:center;font-size:13.5px;color:var(--ink-2)}
.form{max-width:400px;display:flex;flex-direction:column;gap:14px}
.form label{font-size:13px;color:var(--ink-2);display:block;margin-bottom:6px}
.form input{width:100%;background:var(--surface);border:0;border-radius:11px;padding:12px 14px;font:inherit;font-size:14px}

@media (max-width:900px){
  table{font-size:13px;table-layout:fixed;width:100%}
  td,th{white-space:normal;word-break:break-word}
  th,td{padding-left:8px;padding-right:8px}
  .card{padding:16px}
  .focus{padding:26px;gap:18px;min-height:0}
  .focus__n{font-size:64px}
  .focus__t b{font-size:18px}
  .app{grid-template-columns:1fr}
  .rail{flex-direction:row;overflow:auto;padding:14px 16px;gap:16px;align-items:center}
  .nav{flex-direction:row;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .nav a{padding:8px 12px;white-space:nowrap}
  .me{margin:0;display:none}
  .main{padding:22px 20px 60px}
  .g2,.g3{grid-template-columns:1fr}
  .focus{flex-wrap:wrap;gap:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}
</style>
</head>

/* ============================================================

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/** 状态 → 色调 */
function tone(s){
  if(/待|进行中|构思中/.test(s)) return /反馈|实名/.test(s) ? 't-danger' : 't-warn';
  if(/已通过|已发布|已完成|已批注|获奖/.test(s)) return 't-ok';
  if(/已拒绝|已下架/.test(s)) return 't-mute';
  if(/待审核|待批注/.test(s)) return 't-warn';
  return 't-mute';
}

/** 折线：pathLength=1 让描线动画与数据长度无关 */
function lineChart(data){
  const w = 560, h = 150, max = Math.max(...data) * 1.15;
  const pts = data.map((v,i)=>[i/(data.length-1)*w, h - v/max*h]);
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h+14}" preserveAspectRatio="none" aria-label="学习记录趋势，近 30 天上升">
    <path class="area" d="${d} L${w} ${h+14} L0 ${h+14} Z"/>
    <path class="line" pathLength="1" d="${d}"/>
  </svg>`;
}

/** 环形：total 分段 */
function donut(parts, size = 132){
  const r = size/2 - 14, c = 2*Math.PI*r, sum = parts.reduce((a,p)=>a+p[1],0);
  let off = 0;
  const arcs = parts.map(([label,val,color])=>{
    const len = val/sum*c, seg = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none"
      stroke="${color}" stroke-width="14" stroke-linecap="butt"
      stroke-dasharray="${len.toFixed(1)} ${(c-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"
      transform="rotate(-90 ${size/2} ${size/2})" data-arc/>`;
    off += len; return seg;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${arcs}</svg>`;
}

function legend(parts){
  return parts.map(([l,v,c])=>`<div><i style="background:${c}"></i>${l}<b>${v}</b></div>`).join('');
}

function barRows(rows){
  const max = Math.max(...rows.map(r=>r[1]));
  return rows.map(([l,v])=>`<div class="bar-row"><span>${l}</span>
    <div class="track"><div class="fill" data-w="${(v/max*100).toFixed(1)}%"></div></div>
    <var>${v}</var></div>`).join('');
}

function go(k){
  route = k;
  const v = VIEW[k];
  $('#ttl').textContent = v.ttl;
  $('#sub').textContent = v.sub;
  $('#view').innerHTML = v.render();
  $('#view').classList.remove('view');
  void $('#view').offsetWidth;       // 重启动画
  $('#view').classList.add('view');
  renderNav();
  requestAnimationFrame(afterMount);
}

/** 挂载后：数字滚动、条形入场、首个 tab */
function afterMount(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const to = +el.dataset.count, t0 = performance.now(), dur = 700;
    (function step(t){
      const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
      el.textContent = Math.round(to*e);
      if(p<1) requestAnimationFrame(step);
    })(t0);
  });
  document.querySelectorAll('.bar-row .fill').forEach(f=>{ f.style.width = f.dataset.w; });
  const first = $('.seg button');
  if(first) tab(first.dataset.tab);
}

function tab(key){
  const seg = $('.seg');
  if(seg) [...seg.children].forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===key));
  const map = {fb:'#qbody',vf:'#qbody',ct:'#cbody',an:'#cbody',gd:'#cbody',lg:'#gbody',rs:'#gbody',tk:'#gbody'};
  const host = $(map[key]);
  if(!host) return;
  host.innerHTML = BODY[key]();
  host.classList.remove('view'); void host.offsetWidth; host.classList.add('view');
}

function drawer(html){
  $('#dbody').innerHTML = html;
  $('#drawer').classList.add('on');
  $('#scrim').classList.add('on');
}
function closeDrawer(){
  $('#drawer').classList.remove('on');
  $('#scrim').classList.remove('on');
}

/* 事件委托：全站只挂 1 个点击监听 */
document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-route],[data-go],[data-tab],[data-toggle],[data-answered],[data-review],[data-profile],[data-project],[data-act]');
  if(!t) return;
  if(t.dataset.route){ e.preventDefault(); go(t.dataset.route); return; }
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.tab){ tab(t.dataset.tab); return; }

  if(t.dataset.toggle !== undefined){
    const tr = t.closest('tr');
    const wasOpen = tr.classList.contains('open');
    tr.parentElement.querySelectorAll('tr.open').forEach(r=>r.classList.remove('open'));
    if(!wasOpen) tr.classList.add('open');
    return;
  }
  if(t.dataset.answered){               // 红 → 绿
    const tr = t.closest('tr');
    const chip = tr.querySelector('.tag');
    chip.textContent = '已回复';
    chip.className = 'tag t-ok';
    tr.classList.remove('open');
    return;
  }
  if(t.dataset.review){                 // 通过 → 离开列表
    const tr = t.closest('tr');
    tr.style.transition = 'opacity .3s';
    tr.style.opacity = '0';
    setTimeout(()=>tr.remove(), 300);
    return;
  }
  if(t.dataset.profile){ profile(t.dataset.profile); return; }
  if(t.dataset.project){ project(t.dataset.project); return; }

  switch(t.dataset.act){
    case 'close': closeDrawer(); break;
    case 'role': drawer('<h2>调整角色</h2><p class="sub">学生 → 教师会同步把认证状态设为已通过</p><div class="seg" style="margin:0"><button aria-selected="true">学生</button><button>教师</button><button>管理员</button></div>'); break;
    case 'del': case 'onoff': case 'edit': case 'read': case 'close-task':
      drawer(`<h2>${ {del:'删除确认',onoff:'上下架',edit:'编辑',read:'详情',['close-task']:'关闭任务'}[t.dataset.act] }</h2><p class="sub">演示未接真实接口，落地时对接云函数。</p>`); break;
  }
});

/* 默认进看板；#login 看登录页（便于评审与截图） */
(function boot(){
  const h = location.hash.replace('#','');
  if(h === 'login') return;
  $('#login').hidden = true;
  $('#app').hidden = false;
  go(VIEW[h] ? h : 'today');
})();

$('#view').addEventListener('submit', (e)=>{
  e.preventDefault();
  drawer('<h2>密码已更新</h2><p class="sub">下次登录请使用新密码。此演示未接入真实接口。</p>');
});
</script>
</body>
