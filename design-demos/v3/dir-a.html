<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方向 A · Liquid Glass 悬浮层 — 计科创新中心</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0b0b10;
    /* 圆体优先：幼圆提供圆润字形，Nunito 补足数字与拉丁，苹方兜底保证可读 */
    font-family: "Nunito", "YouYuan", "幼圆", "Yuanti SC", -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    /* 幼圆只有 Regular，允许浏览器合成字重，UI 才有主次 */
    font-synthesis: weight;
    letter-spacing: 0.006em;
  }

  /* 标题层：真圆体。幼圆只有 Regular，靠放大字号与放松行距换取分量，不硬加粗 */
  .cn-round {
    font-family: "Nunito", "YouYuan", "幼圆", "Yuanti SC", -apple-system, "PingFang SC", sans-serif !important;
    font-weight: 400 !important;
    font-synthesis: none;
    letter-spacing: 0.01em !important;
    text-shadow: 0.4px 0 0 currentColor, -0.4px 0 0 currentColor, 0 0.4px 0 currentColor, 0 -0.4px 0 currentColor;
  }
  /* 圆体英文标签 / 数字 */
  .num {
    font-family: "Nunito", ui-rounded, -apple-system, "PingFang SC", sans-serif !important;
    font-variant-numeric: tabular-nums;
  }
  /* 圆体只有合成粗体，力度有限，强调改用颜色，比硬加粗更清楚也更好看 */
  b, strong {
    font-weight: 700;
    color: #3B5BFF;
  }
  /* 代码与输入输出结论保持等宽，不参与圆体化 */
  .mono, .mono * {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important;
    letter-spacing: 0 !important;
    text-shadow: none !important;
    font-synthesis: none !important;
  }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(46px,-30px) scale(1.12); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1.05); } 50% { transform: translate(-40px,26px) scale(0.92); } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes ringDraw { from { stroke-dashoffset: 264; } to { stroke-dashoffset: 78; } }
  .pressable { transition: transform .34s cubic-bezier(.22,1,.36,1), box-shadow .34s cubic-bezier(.22,1,.36,1); }
  .pressable:active { transform: scale(.965); }
  .scroller::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const iosFrameStyles = {
  wrapper: { display: 'inline-block', padding: 12, background: '#000', borderRadius: 62, boxShadow: '0 0 0 1.5px rgba(255,255,255,.14), 0 40px 90px rgba(0,0,0,.55)', position: 'relative' },
  screen: { position: 'relative', borderRadius: 50, overflow: 'hidden' },
  statusBar: { position: 'absolute', top: 0, left: 0, right: 0, height: 54, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 32px', fontSize: 16, fontWeight: 600, fontFamily: '-apple-system, "SF Pro Text", sans-serif', zIndex: 20, pointerEvents: 'none' },
  dynamicIsland: { position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)', width: 124, height: 36, background: '#000', borderRadius: 999, zIndex: 30 },
  statusIcons: { display: 'flex', alignItems: 'center', gap: 6 },
  signalIcon: { display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 },
  signalBar: { width: 3, background: 'currentColor', borderRadius: 1 },
  batteryIcon: { width: 26, height: 12, border: '1.5px solid currentColor', borderRadius: 3, padding: 1, position: 'relative', opacity: 0.8 },
  batteryCap: { position: 'absolute', top: 3, right: -3, width: 2, height: 6, background: 'currentColor', borderRadius: '0 1px 1px 0' },
  content: { position: 'absolute', top: 54, left: 0, right: 0, bottom: 34, overflow: 'auto' },
  homeIndicator: { position: 'absolute', bottom: 10, left: '50%', transform: 'translateX(-50%)', width: 140, height: 5, background: 'rgba(0,0,0,.28)', borderRadius: 999, zIndex: 10 },
  homeIndicatorDark: { background: 'rgba(255,255,255,.5)' },
};

function IosFrame({ children, width = 393, height = 852, time = '9:41', battery = 82, darkMode = false }) {
  const textColor = darkMode ? '#fff' : '#000';
  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{ ...iosFrameStyles.screen, width, height, background: darkMode ? '#000' : '#fff' }}>
        <div style={{ ...iosFrameStyles.statusBar, color: textColor }}>
          <span>{time}</span>
          <div style={iosFrameStyles.statusIcons}>
            <div style={iosFrameStyles.signalIcon}>
              {[4, 6, 9, 11].map((h, i) => <div key={i} style={{ ...iosFrameStyles.signalBar, height: h }} />)}
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color: textColor }}>
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
              <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
              <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
            </svg>
            <div style={iosFrameStyles.batteryIcon}>
              <div style={{ width: battery + '%', height: '100%', background: 'currentColor', borderRadius: 1, opacity: 0.9 }} />
              <div style={iosFrameStyles.batteryCap} />
            </div>
          </div>
        </div>
        <div style={iosFrameStyles.dynamicIsland} />
        <div style={{ ...iosFrameStyles.content }} className="scroller">{children}</div>
        <div style={{ ...iosFrameStyles.homeIndicator, ...(darkMode ? iosFrameStyles.homeIndicatorDark : {}) }} />
      </div>
    </div>
  );
}

/* ============ 设计令牌 A ============ */
const A = {
  ink: '#0E0E12',
  ink2: '#5C5C68',
  ink3: '#9A9AA6',
  accent: 'linear-gradient(135deg,#3B5BFF 0%,#7C5CFF 58%,#A855F7 100%)',
  blue: '#3B5BFF',
  glass: 'rgba(255,255,255,0.46)',
  glassStrong: 'rgba(255,255,255,0.70)',
  hair: 'rgba(255,255,255,0.92)',
  shadow: 'inset 0 1px 0 rgba(255,255,255,0.95), 0 12px 36px rgba(38,52,110,0.11), 0 1px 2px rgba(38,52,110,0.07)',
};

function Blobs() {
  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', background: 'linear-gradient(180deg,#F7F8FC 0%,#F2F3FA 100%)' }}>
      <div style={{ position: 'absolute', top: -90, left: -70, width: 300, height: 300, borderRadius: '50%', background: 'radial-gradient(circle at 35% 35%, rgba(88,120,255,.55), rgba(88,120,255,0) 68%)', filter: 'blur(6px)', animation: 'drift1 19s ease-in-out infinite' }} />
      <div style={{ position: 'absolute', top: 120, right: -110, width: 320, height: 320, borderRadius: '50%', background: 'radial-gradient(circle at 50% 50%, rgba(186,124,255,.45), rgba(186,124,255,0) 66%)', filter: 'blur(8px)', animation: 'drift2 23s ease-in-out infinite' }} />
      <div style={{ position: 'absolute', bottom: 40, left: 30, width: 280, height: 280, borderRadius: '50%', background: 'radial-gradient(circle at 50% 50%, rgba(90,220,200,.36), rgba(90,220,200,0) 66%)', filter: 'blur(10px)', animation: 'drift1 27s ease-in-out infinite reverse' }} />
    </div>
  );
}

function Glass({ children, style, pad = 18, radius = 26, strong = false, onClick }) {
  return (
    <div
      onClick={onClick}
      className="pressable"
      style={{
        background: strong ? A.glassStrong : A.glass,
        backdropFilter: 'blur(28px) saturate(180%)',
        WebkitBackdropFilter: 'blur(28px) saturate(180%)',
        border: '1px solid ' + A.hair,
        borderRadius: radius,
        padding: pad,
        boxShadow: A.shadow,
        cursor: onClick ? 'pointer' : 'default',
        ...style,
      }}
    >{children}</div>
  );
}

const Dock = ({ active, onChange }) => {
  const items = [
    { k: 'home', label: '首页', d: 'M4 11 L12 4 L20 11 V20 H4 Z' },
    { k: 'learn', label: '学习', d: 'M5 5h6v14H5z M13 5h6v9h-6z' },
    { k: 'contest', label: '赛事', d: 'M7 4h10v5a5 5 0 01-10 0z M12 14v4 M8 20h8' },
    { k: 'project', label: '项目', d: 'M4 7h7l2 3h7v9H4z' },
    { k: 'mine', label: '我的', d: 'M12 12a4 4 0 100-8 4 4 0 000 8z M4 21c0-4 3.6-6 8-6s8 2 8 6' },
  ];
  return (
    <div style={{ position: 'absolute', left: 16, right: 16, bottom: 18, zIndex: 40 }}>
      <div style={{
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        padding: '9px 12px',
        background: 'rgba(255,255,255,0.62)',
        backdropFilter: 'blur(32px) saturate(200%)',
        WebkitBackdropFilter: 'blur(32px) saturate(200%)',
        border: '1px solid rgba(255,255,255,0.9)',
        borderRadius: 30,
        boxShadow: '0 18px 44px rgba(30,42,90,0.18), 0 1px 0 rgba(255,255,255,.9) inset',
      }}>
        {items.map(it => {
          const on = active === it.k;
          return (
            <div key={it.k} onClick={() => onChange(it.k)} className="pressable"
              style={{
                flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3,
                padding: '7px 0', borderRadius: 22, cursor: 'pointer',
                background: on ? 'linear-gradient(135deg,rgba(59,91,255,.14),rgba(168,85,247,.14))' : 'transparent',
                transition: 'background .3s',
              }}>
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none"
                stroke={on ? A.blue : A.ink3} strokeWidth={on ? 2.1 : 1.7} strokeLinecap="round" strokeLinejoin="round"
                style={{ transform: on ? 'translateY(-1px) scale(1.06)' : 'none', transition: 'transform .35s cubic-bezier(.22,1,.36,1)' }}>
                <path d={it.d} />
              </svg>
              <span style={{ fontSize: 10, fontWeight: on ? 700 : 500, color: on ? A.blue : A.ink3, letterSpacing: '0.01em' }}>{it.label}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
};

const LargeTitle = ({ children, sub }) => (
  <div style={{ padding: '10px 22px 6px' }}>
    <div className="cn-round" style={{ fontSize: 40, color: A.ink, lineHeight: 1.22 }}>{children}</div>
    {sub && <div style={{ marginTop: 9, fontSize: 13, color: A.ink3, letterSpacing: '0.012em', fontWeight: 400 }}>{sub}</div>}
  </div>
);

/* ============ 屏 1 · 首页 ============ */
function ScreenHome({ go }) {
  return (
    <div style={{ position: 'relative', minHeight: '100%', paddingBottom: 108 }}>
      <Blobs />
      <div style={{ position: 'relative', paddingTop: 6 }}>
        <LargeTitle sub="周三 11 月 5 日 · 距「蓝桥杯」报名截止 12 天">计科创新中心</LargeTitle>

        <div style={{ padding: '16px 18px 0' }}>
          <Glass strong pad={20} radius={30} onClick={() => go('problem')} style={{ position: 'relative', overflow: 'hidden' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
              <div>
                <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.08em', color: A.blue, marginBottom: 8 }}>继续上次</div>
                <div style={{ fontSize: 19.5, fontWeight: 700, letterSpacing: '0.008em', color: A.ink, lineHeight: 1.32 }}>两数之和</div>
                <div style={{ marginTop: 4, fontSize: 12.5, color: A.ink2 }}>数组 · 哈希表 · 简单</div>
              </div>
              <svg width="76" height="76" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="42" stroke="rgba(59,91,255,.12)" strokeWidth="7" fill="none" />
                <circle cx="50" cy="50" r="42" stroke="url(#gA)" strokeWidth="7" fill="none" strokeLinecap="round"
                  strokeDasharray="264" strokeDashoffset="78" transform="rotate(-90 50 50)" style={{ animation: 'ringDraw 1.4s cubic-bezier(.22,1,.36,1) both' }} />
                <defs><linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#3B5BFF" /><stop offset="1" stopColor="#A855F7" /></linearGradient></defs>
                <text x="50" y="55" textAnchor="middle" fontSize="24" fontWeight="800" fill="#0E0E12" letterSpacing="-1">70%</text>
              </svg>
            </div>
            <div style={{ marginTop: 16, height: 44, borderRadius: 16, background: A.accent, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontSize: 14.5, fontWeight: 700, letterSpacing: '0.008em', boxShadow: '0 8px 22px rgba(59,91,255,.32)' }}>
              继续答题
            </div>
          </Glass>
        </div>

        <div style={{ padding: '20px 18px 0' }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            {[
              { t: '学习任务', s: '2 项待提交', g: 'linear-gradient(135deg,#3B5BFF,#6E8BFF)' },
              { t: '学习记录', s: '连续 7 天', g: 'linear-gradient(135deg,#A855F7,#D08BFF)' },
              { t: '学习问答', s: '5 个待解决', g: 'linear-gradient(135deg,#12B5A5,#5BE0C6)' },
              { t: '赛事库', s: '28 项可参与', g: 'linear-gradient(135deg,#FF7A45,#FFB088)' },
            ].map(item => (
              <Glass key={item.t} pad={15} radius={24} onClick={() => {}}>
                <div style={{ width: 30, height: 30, borderRadius: 10, background: item.g, marginBottom: 12, boxShadow: '0 6px 14px rgba(30,42,90,.18)' }} />
                <div style={{ fontSize: 14.5, fontWeight: 700, color: A.ink, letterSpacing: '0.008em' }}>{item.t}</div>
                <div style={{ marginTop: 2, fontSize: 11.5, color: A.ink2 }}>{item.s}</div>
              </Glass>
            ))}
          </div>
        </div>

        <div style={{ padding: '24px 22px 8px', display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div style={{ fontSize: 17, fontWeight: 700, letterSpacing: '0.008em', color: A.ink }}>公告</div>
          <div style={{ fontSize: 12.5, color: A.blue, fontWeight: 600 }}>全部</div>
        </div>
        <div style={{ padding: '0 18px' }}>
          {[
            { t: '2026 年蓝桥杯省赛报名启动', d: '教务 · 2 小时前' },
            { t: '算法训练营第 4 期开营', d: '张老师 · 昨天' },
          ].map((n, i) => (
            <Glass key={i} pad={15} radius={22} style={{ marginBottom: 10 }}>
              <div style={{ fontSize: 14, fontWeight: 620, color: A.ink, letterSpacing: '0.008em', lineHeight: 1.45 }}>{n.t}</div>
              <div style={{ marginTop: 3, fontSize: 11.5, color: A.ink3 }}>{n.d}</div>
            </Glass>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============ 屏 2 · 学习 ============ */
function ScreenLearn({ go }) {
  return (
    <div style={{ position: 'relative', minHeight: '100%', paddingBottom: 108 }}>
      <Blobs />
      <div style={{ position: 'relative', paddingTop: 6 }}>
        <LargeTitle sub="今天已练习 3 题 · 保持第 7 天">学习</LargeTitle>

        <div style={{ padding: '16px 18px 0', display: 'flex', gap: 12 }}>
          <Glass strong pad={17} radius={26} style={{ flex: 1 }} onClick={() => go('problem')}>
            <div className="num" style={{ fontSize: 27, fontWeight: 800, letterSpacing: '0.008em', color: A.ink, lineHeight: 1 }}>820</div>
            <div style={{ marginTop: 7, fontSize: 12.5, color: A.ink2, fontWeight: 550 }}>题库 · 算法训练</div>
          </Glass>
          <Glass strong pad={17} radius={26} style={{ flex: 1 }} onClick={() => go('qa')}>
            <div className="num" style={{ fontSize: 27, fontWeight: 800, letterSpacing: '0.008em', color: A.ink, lineHeight: 1 }}>5</div>
            <div style={{ marginTop: 7, fontSize: 12.5, color: A.ink2, fontWeight: 550 }}>待解决问题</div>
          </Glass>
        </div>

        <div style={{ padding: '18px 18px 0' }}>
          <div style={{ display: 'flex', padding: 4, background: 'rgba(255,255,255,.5)', backdropFilter: 'blur(20px)', border: '1px solid rgba(255,255,255,.9)', borderRadius: 18, boxShadow: A.shadow }}>
            {['学习任务', '学习记录'].map((t, i) => (
              <div key={t} className="pressable" style={{
                flex: 1, textAlign: 'center', padding: '9px 0', borderRadius: 14, fontSize: 13.5, fontWeight: i === 0 ? 700 : 550,
                color: i === 0 ? '#fff' : A.ink2, background: i === 0 ? 'linear-gradient(135deg,#3B5BFF,#7C5CFF)' : 'transparent',
                boxShadow: i === 0 ? '0 6px 16px rgba(59,91,255,.28)' : 'none', cursor: 'pointer',
              }}>{t}</div>
            ))}
          </div>
        </div>

        <div style={{ padding: '16px 18px 0' }}>
          {[
            { t: '完成「二分查找」专题 5 题', s: '待提交', c: '#FF8A3D', d: '截止 11 月 8 日', p: 40 },
            { t: '整理本周学习笔记并上传', s: '已提交', c: '#12B5A5', d: '张老师已批阅', p: 100 },
          ].map((task, i) => (
            <Glass key={i} pad={17} radius={24} strong style={{ marginBottom: 11 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 10 }}>
                <div style={{ fontSize: 14.5, fontWeight: 680, color: A.ink, letterSpacing: '0.008em', lineHeight: 1.4 }}>{task.t}</div>
                <div style={{ flexShrink: 0, padding: '3px 9px', borderRadius: 999, background: task.c + '1F', color: task.c, fontSize: 10.5, fontWeight: 700 }}>{task.s}</div>
              </div>
              <div style={{ marginTop: 10, height: 4, borderRadius: 999, background: 'rgba(90,100,140,.10)' }}>
                <div style={{ width: task.p + '%', height: '100%', borderRadius: 999, background: A.accent }} />
              </div>
              <div style={{ marginTop: 9, fontSize: 11.5, color: A.ink3 }}>{task.d}</div>
            </Glass>
          ))}
        </div>

        <div style={{ padding: '10px 18px 0' }}>
          <Glass pad={17} radius={24}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 12 }}>
              <span style={{ fontSize: 13, fontWeight: 700, color: A.ink }}>本周节奏</span>
              <span style={{ fontSize: 11, color: A.ink3 }}>共 28 题</span>
            </div>
            <div style={{ display: 'flex', alignItems: 'flex-end', gap: 6, height: 46 }}>
              {[40, 62, 30, 88, 55, 20, 8].map((h, i) => (
                <div key={i} style={{ flex: 1, height: h + '%', borderRadius: 3, background: i === 3 ? A.accent : 'rgba(90,100,140,.16)' }} />
              ))}
            </div>
            <div style={{ marginTop: 7, display: 'flex', gap: 6 }}>
              {['一', '二', '三', '四', '五', '六', '日'].map((d, i) => (
                <span key={i} style={{ flex: 1, textAlign: 'center', fontSize: 9.5, color: i === 3 ? A.blue : A.ink3, fontWeight: i === 3 ? 700 : 500 }}>{d}</span>
              ))}
            </div>
          </Glass>
        </div>
      </div>
    </div>
  );
}

/* ============ 屏 3 · 赛事库 ============ */
function ScreenContest() {
  return (
    <div style={{ position: 'relative', minHeight: '100%', paddingBottom: 108 }}>
      <Blobs />
      <div style={{ position: 'relative', paddingTop: 6 }}>
        <LargeTitle sub="28 项赛事 · 最近可参与优先">赛事库</LargeTitle>

        <div style={{ padding: '14px 18px 0' }}>
          <Glass pad={12} radius={18} style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={A.ink3} strokeWidth="2.2" strokeLinecap="round"><circle cx="11" cy="11" r="7" /><path d="M16.5 16.5L21 21" /></svg>
            <span style={{ fontSize: 13.5, color: A.ink3 }}>搜索竞赛名称</span>
          </Glass>
        </div>

        <div style={{ display: 'flex', gap: 8, padding: '12px 18px 0', overflowX: 'auto' }} className="scroller">
          {['全部', 'A 类', 'B 类', 'C 类', '★ 院内重点'].map((c, i) => (
            <div key={c} className="pressable" style={{
              flexShrink: 0, padding: '7px 14px', borderRadius: 999, fontSize: 12.5, fontWeight: 600, cursor: 'pointer',
              background: i === 0 ? 'linear-gradient(135deg,#3B5BFF,#7C5CFF)' : 'rgba(255,255,255,.62)',
              color: i === 0 ? '#fff' : A.ink2,
              border: '1px solid ' + (i === 0 ? 'transparent' : 'rgba(255,255,255,.9)'),
              boxShadow: i === 0 ? '0 6px 16px rgba(59,91,255,.28)' : A.shadow,
            }}>{c}</div>
          ))}
        </div>

        <div style={{ padding: '14px 18px 0' }}>

/* ============ 单机 ============ */
function AppPhone({ initial = 'home' }) {
  const [screen, setScreen] = React.useState(initial);
  const go = (s) => setScreen(s);
  const cur = screen;
  return (
      <IosFrame>
        <div style={{ position: 'relative', height: '100%' }}>
          <div style={{ height: '100%', overflowY: 'auto' }} className="scroller">
            {cur === 'home' && <ScreenHome go={go} />}
            {cur === 'learn' && <ScreenLearn go={go} />}
            {cur === 'contest' && <ScreenContest />}
            {cur === 'problem' && <ScreenProblem back={() => go('learn')} />}
            {cur === 'qa' && <ScreenQA back={() => go('learn')} />}
            {cur === 'mine' && <ScreenMine />}
            {cur === 'project' && <ScreenProject />}
          </div>
          <Dock active={cur === 'problem' || cur === 'qa' ? 'learn' : cur} onChange={go} />
          {cur === 'qa' && (
            <div style={{ position: 'absolute', right: 22, bottom: 96, zIndex: 41 }}>
              <div className="pressable" style={{ width: 54, height: 54, borderRadius: '50%', background: A.accent, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 14px 30px rgba(59,91,255,.4)', cursor: 'pointer' }}>

              </div>
            </div>
          )}
        </div>
      </IosFrame>
  );
}

/* 缩放后按真实视觉尺寸占位，否则布局会留下大片空白 */
function ScaleBox({ s = 1, children }) {
  return (
    <div style={{ width: 417 * s, height: 876 * s, position: 'relative', flexShrink: 0 }}>
      <div style={{ position: 'absolute', top: 0, left: 0, transform: `scale(${s})`, transformOrigin: 'top left' }}>
        {children}
      </div>
    </div>
  );
}
