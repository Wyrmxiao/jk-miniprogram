<!DOCTYPE html>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #EFEDE8; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes markIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .stagger > * { animation: rise .6s cubic-bezier(.22,1,.36,1) both; }
  .stagger > *:nth-child(1) { animation-delay: .02s; }
  .stagger > *:nth-child(2) { animation-delay: .07s; }
  .stagger > *:nth-child(3) { animation-delay: .12s; }
  .stagger > *:nth-child(4) { animation-delay: .17s; }
  .stagger > *:nth-child(5) { animation-delay: .22s; }
  .stagger > *:nth-child(6) { animation-delay: .27s; }
  .press { transition: transform .28s cubic-bezier(.22,1,.36,1), opacity .2s; }
  .press:active { transform: scale(.978); opacity: .82; }
  .sc::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const iosFrameStyles = {

  screen: { position: 'relative', borderRadius: 48, overflow: 'hidden' },
  statusBar: { position: 'absolute', top: 0, left: 0, right: 0, height: 54, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 32px', fontSize: 16, fontWeight: 600, zIndex: 20, pointerEvents: 'none' },

  statusIcons: { display: 'flex', alignItems: 'center', gap: 6 },
  signalIcon: { display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 },

  batteryCap: { position: 'absolute', top: 3, right: -3, width: 2, height: 6, background: 'currentColor', borderRadius: '0 1px 1px 0' },
  content: { position: 'absolute', top: 54, left: 0, right: 0, bottom: 34, overflow: 'auto' },
  homeIndicator: { position: 'absolute', bottom: 10, left: '50%', transform: 'translateX(-50%)', width: 140, height: 5, background: 'rgba(0,0,0,.32)', borderRadius: 999, zIndex: 10 },

function IosFrame({ children, width = 393, height = 852, time = '9:41', battery = 82 }) {
  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{ ...iosFrameStyles.screen, width, height, background: '#FCFBF9' }}>
        <div style={{ ...iosFrameStyles.statusBar, color: '#000' }}>
          <span>{time}</span>
          <div style={iosFrameStyles.statusIcons}>
            <div style={iosFrameStyles.signalIcon}>{[4, 6, 9, 11].map((h, i) => <div key={i} style={{ ...iosFrameStyles.signalBar, height: h }} />)}</div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color: '#000' }}>
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
              <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
              <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity=".7" />

        </div>
        <div style={iosFrameStyles.dynamicIsland} />
        <div style={iosFrameStyles.content} className="sc">{children}</div>
        <div style={iosFrameStyles.homeIndicator} />
      </div>
    </div>
  );
}

const C = {
  paper: '#FCFBF9',
  ink: '#101014',
  ink2: '#5E5E66',
  ink3: '#A0A0A8',
  rule: 'rgba(16,16,20,.14)',
  ruleLight: 'rgba(16,16,20,.08)',
  accent: '#FF3B2F',
  marker: '#F2FF49',

const Rule = ({ style }) => <div style={{ height: 1, background: C.rule, transformOrigin: 'left', animation: 'growX .7s cubic-bezier(.22,1,.36,1) both', ...style }} />;

const Kicker = ({ children, tone }) => (
  <div style={{ fontSize: 12, fontWeight: 750, letterSpacing: '0.10em', color: tone || C.accent }}>{children}</div>
);

/* ===== 屏 1 · 首页（编辑头版） ===== */

/* ===== 屏 2 · 学习（目录式） ===== */

/* ===== 屏 3 · 赛事（榜单） ===== */

function AppPhone({ initial = 'home' }) {
  const [screen, setScreen] = React.useState(initial);
  const go = (s) => setScreen(s);
  const nav = [['home', '首页'], ['learn', '学习'], ['contest', '赛事'], ['project', '项目'], ['mine', '我的']];
  return (
      <IosFrame>
        <div style={{ position: 'relative', height: '100%' }}>
          <div style={{ height: '100%', overflowY: 'auto' }} className="sc">
            {screen === 'home' && <ScreenHome go={go} />}
            {screen === 'learn' && <ScreenLearn go={go} />}
            {screen === 'contest' && <ScreenRace />}
            {screen === 'project' && <ScreenProject />}
            {screen === 'problem' && <ScreenProblem back={() => go('learn')} />}
            {screen === 'mine' && <ScreenMine />}
            <div style={{ height: 24 }} />
          </div>
          <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, padding: '30px 24px 22px', background: 'linear-gradient(180deg, rgba(252,251,249,0) 0%, rgba(252,251,249,.97) 28%, ' + C.paper + ' 48%)' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', borderTop: '1px solid ' + C.rule, paddingTop: 13 }}>
              {nav.map(([k, label]) => {
                const on = (screen === 'problem' ? 'learn' : screen) === k;
                return (
                  <div key={k} onClick={() => go(k)} className="press" style={{ cursor: 'pointer', flex: 1, textAlign: 'center' }}>
                    <span style={{ fontSize: 12, fontWeight: on ? 800 : 550, color: on ? C.ink : C.ink3, letterSpacing: '0.01em', position: 'relative' }}>
                      {label}
                      {on && <span style={{ position: 'absolute', left: '50%', transform: 'translateX(-50%)', bottom: -7, width: 4, height: 4, borderRadius: 999, background: C.accent }} />}
                    </span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </IosFrame>
  );
}

function ScaleBox({ s = 1, children }) {
  return (
    <div style={{ width: 417 * s, height: 876 * s, position: 'relative', flexShrink: 0 }}>
      <div style={{ position: 'absolute', top: 0, left: 0, transform: `scale(${s})`, transformOrigin: 'top left' }}>
        {children}
      </div>
    </div>
  );
}
